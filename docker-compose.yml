version: '3.8'

services:
  # --- 1. BASE DE DATOS ---
  postgres:
    build: ./Backend/baseDatos
    container_name: restaurant_db_container
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # --- 2. BACKEND (API GO) ---
  backend:
    build: ./Backend/api
    container_name: restaurant_app_container
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    
    # Nota: Ya no necesitamos "extra_hosts" porque vamos a internet (Alchemy),
    # no a tu máquina local.
    
    extra_hosts:
      - "impresora-host:192.168.1.100" 
    
    environment:
      TZ: America/Bogota
      PRINTER_ADDRESS: "impresora-host:9100"
      DATABASE_URL: ${DATABASE_URL}
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS}
      WALLET_PRIVATE_KEY: ${WALLET_PRIVATE_KEY}
      INVOICE_ENCRYPTION_KEY: ${INVOICE_ENCRYPTION_KEY}
      PRINT_RECOVERY_MODE: ${PRINT_RECOVERY_MODE}
      PRINT_RECOVERY_LOOKBACK_MINUTES: ${PRINT_RECOVERY_LOOKBACK_MINUTES}
      PRINT_AUTO_RETRY_ENABLED: ${PRINT_AUTO_RETRY_ENABLED}
      PRINT_AUTO_RETRY_INTERVAL_SECONDS: ${PRINT_AUTO_RETRY_INTERVAL_SECONDS}
      PRINT_AUTO_RETRY_LOOKBACK_MINUTES: ${PRINT_AUTO_RETRY_LOOKBACK_MINUTES}
      PRINT_AUTO_RETRY_COOLDOWN_SECONDS: ${PRINT_AUTO_RETRY_COOLDOWN_SECONDS}
      PRINT_AUTO_RETRY_COOLDOWN_MINUTES: ${PRINT_AUTO_RETRY_COOLDOWN_MINUTES}
      PRINT_AUTO_RETRY_MAX_ATTEMPTS: ${PRINT_AUTO_RETRY_MAX_ATTEMPTS}
      PRINT_HEALTHCHECK_TIMEOUT_MS: ${PRINT_HEALTHCHECK_TIMEOUT_MS}
    volumes:
      # Persistir uploads de comprobantes fuera del contenedor
      - uploads_data:/app/uploads
    restart: unless-stopped

  # --- 3. FRONTEND (REACT) ---
  frontend:
    build: 
      context: ./Frontend/core
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: restaurant_frontend_container
    ports:
      - "8081:80"     # HTTP (para redireccionar a HTTPS)
    # - "443:443"   # HTTPS (¡Aquí vive la cámara!)
    volumes:
      # 1. Inyectamos la carpeta de certificados que creaste con mkcert
      # Ajusta la ruta './Frontend/certs' si la creaste en otro lado
      - ./Frontend/certs:/etc/nginx/certs:ro
      
      # 2. Inyectamos la configuración de Nginx (la crearemos en el siguiente paso)
      - ./Frontend/core/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: unless-stopped

  # --- 4. PROMETHEUS (MONITOREO DE METRICAS) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: restaurant_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./Backend/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    depends_on:
      - backend

  # --- 5. GRAFANA (VISUALIZACION DE METRICAS) ---
  grafana:
    image: grafana/grafana:latest
    container_name: restaurant_grafana
    ports:
      - "3000:3000"
    environment:
      # Permitir incrustar Grafana en un iframe dentro del admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
      # Habilitar acceso anónimo para no requerir login al ver los dashboards embebidos
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      # Configurar Nginx Reverse Proxy /grafana
      - GF_SERVER_DOMAIN=localhost
      - GF_SERVER_ROOT_URL=/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./Backend/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  postgres_data:
  uploads_data:
  prometheus_data:
  grafana_data:
